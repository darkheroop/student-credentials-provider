<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Credentials Provider</title>
  <meta name="description" content="Student Credentials Provider — MD5 Hash Lookup">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">Student Credentials Provider</h1>

    <form id="lookupForm" class="lookup-form" novalidate>
      <div class="field-group">
        <label for="lookupInput" class="sr-only">Enter MD5 hash</label>
        <input
          type="text"
          id="lookupInput"
          name="lookupInput"
          class="lookup-input"
          placeholder="Enter MD5 hash"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="64"
          required
        >
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        Submit
      </button>
    </form>

    <div id="resultArea" class="result-area hidden" role="status" aria-live="polite"></div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
