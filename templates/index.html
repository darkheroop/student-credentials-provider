<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Credentials Provider</title>
  <meta name="description" content="Student Credentials Provider — MD5 Hash Lookup">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="/admin" class="settings-link" aria-label="API Settings" title="API Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </a>

  <main class="container">
    <h1 class="title">Student Credentials Provider</h1>

    <form id="lookupForm" class="lookup-form" novalidate>
      <div class="field-group">
        <label for="lookupInput" class="sr-only">Enter MD5 hash</label>
        <input
          type="text"
          id="lookupInput"
          name="lookupInput"
          class="lookup-input"
          placeholder="Enter MD5 hash"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="64"
          required
        >
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        Submit
      </button>
    </form>

    <div id="resultArea" class="result-area hidden" role="status" aria-live="polite"></div>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
